name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -cover ./...

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t shrink-it:ci .
      - name: Smoke test with compose
        run: |
          cp .env.example .env
          docker compose up -d --build
          for i in $(seq 1 30); do curl -fs localhost:8080/healthz && break; sleep 2; done
          ./scripts/demo.sh
          docker compose down
